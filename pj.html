<!DOCTYPE html>
<html lang="pt-br">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Pessoa Jurídica</title>

  <link rel="stylesheet" href="style.css">

  <style>

    .form-container{

      margin:auto;

      background:white;

      width:100%;
      max-width:430px;

      padding:25px;

      border-radius:20px;

      box-shadow:0 10px 40px rgba(0,0,0,0.3);
    }

    form{
      display:flex;
      flex-direction:column;
      gap:10px;
    }

    input, select{
      padding:9px;

      border:1px solid #ccc;

      border-radius:8px;

      font-size:14px;
    }

    button{
      background:#2563eb;

      color:white;

      border:none;

      padding:12px;

      border-radius:10px;

      cursor:pointer;

      font-size:15px;

      font-weight:bold;

      transition:0.3s;
    }

    button:hover{
      background:#1d4ed8;
    }

    h2{
      margin-bottom:20px;

      text-align:center;

      color:#0f172a;

      font-size:28px;
    }

    .back-button{

      position:absolute;

      top:20px;

      left:20px;

      z-index:999;

      background:white;

      color:#0f172a;

      padding:10px 15px;

      border-radius:10px;

      text-decoration:none;

      font-weight:bold;

      box-shadow:0 5px 15px rgba(0,0,0,0.2);

      transition:0.3s;
    }

    .back-button:hover{
      transform:scale(1.05);
    }

  </style>

</head>

<body>

  <a href="index.html" class="back-button">
    ← Voltar
  </a>

  <div class="form-container">

    <h2>Lead Pessoa Jurídica</h2>

    <form action="https://test.salesforce.com/servlet/servlet.WebToLead?encoding=UTF-8&orgId=00Dbe000003M23E" method="POST">

      <input type="hidden" name="oid" value="00Dbe000003M23E">

      <input type="hidden" name="retURL" value="https://google.com">

      <input type="hidden" name="recordType" value="012be00000200wX">

      <input type="hidden" name="00Nbe000001nMBh" value="B2B">

      <input type="text" name="company" placeholder="Empresa" required>

      <input type="email" name="email" placeholder="Email">

      <input type="text" name="phone" placeholder="Telefone">

      <input type="text" id="celular" name="mobile" placeholder="Celular">

      <input type="text" name="title" placeholder="Cargo">

      <input type="text" name="00Nbe000001oehd" placeholder="Rua">

      <input type="text" name="00Nbe000001oekr" placeholder="Cidade">

      <select name="00Nbe000001oemT">

        <option value="">UF</option>

        <option value="CE">CE</option>
        <option value="SP">SP</option>
        <option value="RJ">RJ</option>
        <option value="MG">MG</option>

      </select>

      <input type="text" name="00Nbe000001oeph" placeholder="CEP">

      <input type="text" name="00Nbe000001ocO6" placeholder="País">

      <input type="text" id="cnpj" name="00Nbe000001ocj8" placeholder="CNPJ">

      <input type="hidden" name="lead_source" value="Site">

      <button type="submit">
        Enviar Lead PJ
      </button>

    </form>

  </div>

  <script>

    const cnpj = document.getElementById('cnpj');

    cnpj.addEventListener('input', (e) => {

      let value = e.target.value;

      value = value.replace(/\D/g,'');

      value = value.replace(/^(\d{2})(\d)/,'$1.$2');

      value = value.replace(/^(\d{2})\.(\d{3})(\d)/,'$1.$2.$3');

      value = value.replace(/\.(\d{3})(\d)/,'.$1/$2');

      value = value.replace(/(\d{4})(\d)/,'$1-$2');

      e.target.value = value;

    });

    const celular = document.getElementById('celular');

    celular.addEventListener('input', (e) => {

      let value = e.target.value;

      value = value.replace(/\D/g,'');

      value = value.replace(/^(\d{2})(\d)/g,'($1) $2');

      value = value.replace(/(\d)(\d{4})$/,'$1-$2');

      e.target.value = value;

    });

  </script>

</body>

</html>
