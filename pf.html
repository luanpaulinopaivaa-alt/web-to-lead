<!DOCTYPE html>
<html lang="pt-br">

<head>

  <meta charset="UTF-8">

  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Lead Pessoa Física</title>

  <link rel="stylesheet" href="style.css">

</head>

<body>

  <a href="index.html" class="back-button">
    ← Voltar
  </a>

  <div class="form-container">

    <h2>Lead Pessoa Física</h2>

    <form
      action="https://test.salesforce.com/servlet/servlet.WebToLead?encoding=UTF-8&orgId=00Dbe000003M23E"
      method="POST"
    >

      <input type="hidden" name="oid" value="00Dbe000003M23E">

      <input type="hidden" name="retURL" value="https://www.frg.com.br/">

      <input type="hidden" name="recordType" value="012be00000200oT">

      <input type="hidden" name="00Nbe000001nMBh" value="B2B">

      <input
        type="text"
        name="first_name"
        placeholder="Nome"
      >

      <input
        type="text"
        name="last_name"
        placeholder="Sobrenome"
        required
      >

      <input
        type="email"
        name="email"
        placeholder="Email"
      >

      <input
        type="text"
        name="phone"
        placeholder="Telefone"
      >

      <input
        type="text"
        id="celular"
        name="mobile"
        placeholder="Celular"
      >

      <input
        type="text"
        name="00Nbe000001oehd"
        placeholder="Rua"
      >

      <input
        type="text"
        name="00Nbe000001oekr"
        placeholder="Cidade"
      >

      <select name="00Nbe000001oemT">

        <option value="">UF</option>

        <option value="AC">AC</option>
        <option value="AL">AL</option>
        <option value="AP">AP</option>
        <option value="AM">AM</option>
        <option value="BA">BA</option>
        <option value="CE">CE</option>
        <option value="DF">DF</option>
        <option value="ES">ES</option>
        <option value="GO">GO</option>
        <option value="MA">MA</option>
        <option value="MT">MT</option>
        <option value="MS">MS</option>
        <option value="MG">MG</option>
        <option value="PA">PA</option>
        <option value="PB">PB</option>
        <option value="PR">PR</option>
        <option value="PE">PE</option>
        <option value="PI">PI</option>
        <option value="RJ">RJ</option>
        <option value="RN">RN</option>
        <option value="RS">RS</option>
        <option value="RO">RO</option>
        <option value="RR">RR</option>
        <option value="SC">SC</option>
        <option value="SP">SP</option>
        <option value="SE">SE</option>
        <option value="TO">TO</option>

      </select>

      <input
        type="text"
        name="00Nbe000001oeph"
        placeholder="CEP"
      >

      <input
        type="text"
        name="00Nbe000001ocO6"
        placeholder="País"
      >

      <input
        type="text"
        id="cpf"
        name="00Nbe000001ocj7"
        placeholder="CPF"
      >

      <input
        type="hidden"
        name="lead_source"
        value="Site"
      >

      <button type="submit">
        Enviar Lead PF
      </button>

    </form>

  </div>

  <!-- Botão WhatsApp -->

  <a
    href="https://wa.me/5585988887777?text=Olá,%20gostaria%20de%20mais%20informações"
    class="whatsapp-float"
    target="_blank"
    rel="noopener noreferrer"
  >

    <img
      src="https://cdn-icons-png.flaticon.com/512/733/733585.png"
      alt="WhatsApp"
    >

  </a>

  <script>

    const cpf = document.getElementById('cpf');

    cpf.addEventListener('input', (e) => {

      let value = e.target.value;

      value = value.replace(/\D/g,'');

      value = value.replace(/(\d{3})(\d)/,'$1.$2');

      value = value.replace(/(\d{3})(\d)/,'$1.$2');

      value = value.replace(/(\d{3})(\d{1,2})$/,'$1-$2');

      e.target.value = value;

    });

    const celular = document.getElementById('celular');

    celular.addEventListener('input', (e) => {

      let value = e.target.value;

      value = value.replace(/\D/g,'');

      value = value.replace(/^(\d{2})(\d)/g,'($1) $2');

      value = value.replace(/(\d)(\d{4})$/,'$1-$2');

      e.target.value = value;

    });

  </script>

</body>

</html>
